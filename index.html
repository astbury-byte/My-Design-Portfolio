<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Design Portfolio</title>

    <style>

        body {
            font-family: Gotham, "Helvetica Neue", Helvetica, Arial, "sans-serif"sans-serif;
            color: #5a2525;
            margin: 0;
            padding: 40px;

            background-image: url("Background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .portfolio-box {

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 45px;

            width: 80%;
            max-width: 1100px;
            min-height: 500px;

            margin: 30px auto;
            padding: 30px;

            background-color: rgba(255, 255, 255, 0.85);

            border: 1px solid #cccccc;

            box-sizing: border-box;
        }


        figure {
            width: 220px;
            margin: 0;
        }


        figure img {
            width: 200px;
            height: 300px;

            object-fit: contain;
            display: block;

            transition: transform 0.2s ease,
                       
        }

        figure img:hover {

            transform: scale(1.06);
            box-shadow: 0px 6px 15px
                        rgba(0, 0, 0, 0.3);
        }


        figcaption {
            margin-top: 10px;
            font-size: 16px;
            line-height: 1.4;
        }


        figcaption strong {
            font-size: 18px;
        }


        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .portfolio-box {
                width: 100%;
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <h1>My Design Portfolio</h1>

    <p class="intro">
        A collection of my graphic design work throughout my classes.
    </p>


    <div class="portfolio-box">


        <figure>

            <a href="Design1_highres.jpg" target="_blank">

                <img
                    src="Design1_thumbnail.jpg"
                    alt="100 Dollar Bill Redesign"
                >

            </a>


            <figcaption>

                <strong>
                    100 Dollar Bill Redesign
                </strong>

                <br><br>

                A currency redesign project for GRC250.
                The design updates the current 100 dollar
                bill into a more modernized visual.

            </figcaption>

        </figure>

        <figure>

            <a href="Design2_highres.jpg"
               target="_blank">

                <img
                    src="Design2_thumbnail.jpg"
                    alt="Online Tea Shop Website"
                >

            </a>


            <figcaption>

                <strong>
                    Online Tea Shop Website
                </strong>

                <br><br>

                A website design for GRC366 of a made-up tea company.
                The design focuses on visual hierarchy,
                navigation, and making information easy
                for users to find.

            </figcaption>

        </figure>


        <figure>

            <a href="Design3_highres.jpg"
               target="_blank">

                <img
                    src="Design3_thumbnail.jpg"
                    alt="Artist Tour Poster"
                >

            </a>


            <figcaption>

                <strong>
                    Artist Tour Poster
                </strong>

                <br><br>

                A tour poster design for GRC250.
                The poster captures the artist's aesthetic
                through the use of texture and typography.

            </figcaption>

        </figure>


    </div>


</body>

</html>
